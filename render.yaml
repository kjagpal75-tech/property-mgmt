services:
  # PostgreSQL Database
  - type: pserv
    name: property-mgmt-db
    databaseName: property_mgmt
    user: property_user
    plan: free
    region: oregon

  # Backend API Server
  - type: web
    name: property-mgmt-api
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    nodeVersion: 18
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: property-mgmt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: property-mgmt-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: property-mgmt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: property-mgmt-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: property-mgmt-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  # React Frontend
  - type: web
    name: property-mgmt-frontend
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm install -g serve && serve -s build -l 3001
    nodeVersion: 18
    envVars:
      - key: REACT_APP_API_URL
        value: https://property-mgmt-api.onrender.com/api
      - key: REACT_APP_AUTH_URL
        value: https://property-mgmt-api.onrender.com/api
      - key: NODE_ENV
        value: production
